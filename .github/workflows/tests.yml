name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Build (backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/backend/package-lock.json

      - name: Install dependencies
        working-directory: packages/backend
        run: npm ci

      - name: Build
        working-directory: packages/backend
        run: npm run build

      - name: Upload node_modules
        uses: actions/upload-artifact@v4
        with:
          name: backend-node-modules
          path: packages/backend/node_modules
          retention-days: 1
          if-no-files-found: error

  unit-tests:
    name: Unit tests (backend)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: backend-node-modules
          path: packages/backend/node_modules

      - name: Run unit tests
        working-directory: packages/backend
        run: npm test -- --ci

  integration-tests:
    name: Integration tests (backend)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: backend-node-modules
          path: packages/backend/node_modules

      - name: Run integration tests (Testcontainers + Postgres)
        working-directory: packages/backend
        run: npx jest --config ./test/jest.config.json

  system-tests:
    name: System tests (Playwright)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start full stack (docker-compose.test.yml)
        run: docker compose -f docker-compose.test.yml up -d --build --wait

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/e2e-web/package-lock.json

      - name: Install dependencies
        working-directory: packages/e2e-web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: packages/e2e-web
        run: npm run install-browsers

      - name: Run system tests
        working-directory: packages/e2e-web
        env:
          BASE_URL: http://localhost
          DATABASE_URL: postgres://agroscope:agroscope@localhost:5433/agroscope_e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e-web/playwright-report/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
