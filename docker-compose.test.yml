# Stack completa para os testes de sistema (Playwright) em packages/e2e-web.
#
# Diferenças em relação ao docker-compose.yml de produção:
#   - Postgres e RabbitMQ reais sobem localmente (não dependem de serviços externos).
#   - MOCK_AI=true faz o backend usar MockPredictService / MockAiAgentService,
#     então o fluxo de análise de imagem e o chat funcionam sem Flask/N8N reais.
#   - Segredos (JWT_SECRET, AES_KEY) são valores fixos só para teste — nunca reutilize
#     em produção.
#
# Uso:
#   docker compose -f docker-compose.test.yml up -d --build
#   (aguardar containers ficarem healthy)
#   cd packages/e2e-web && npx playwright test
#   docker compose -f docker-compose.test.yml down -v   # ao terminar
#
# Nome de projeto fixo (agroscope-e2e) para não colidir com o docker-compose.yml
# de produção caso as duas stacks rodem ao mesmo tempo na mesma máquina — sem
# isso, docker compose usaria o nome do diretório para os dois arquivos e os
# serviços (ex.: "backend") entrariam em conflito.
name: agroscope-e2e

services:
  postgres:
    image: postgres:15-alpine
    networks:
      - app-network
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: agroscope
      POSTGRES_PASSWORD: agroscope
      POSTGRES_DB: agroscope_e2e
    volumes:
      - agroscope_e2e_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroscope -d agroscope_e2e"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-alpine
    networks:
      - app-network
    ports:
      - "5673:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./packages/backend
    networks:
      - app-network
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_URL: postgres://agroscope:agroscope@postgres:5432/agroscope_e2e
      DB_SSL: "false"
      JWT_SECRET: e2e-test-jwt-secret-do-not-use-in-production
      AES_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd"
      CORS_ORIGINS: http://localhost,http://localhost:3000,http://127.0.0.1:3000,http://nginx
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      FLASK_API_URL: http://flask.invalid
      HANDLING_API_URL: http://handling.invalid
      N8N_WEBHOOK_URL: http://n8n.invalid
      HISTORY_CONTEXT_LIMIT: "10"
      MOCK_AI: "true"
      TERMS_VERSION: "2026-08-01"
      THROTTLE_SHORT_TTL: "1"
      THROTTLE_SHORT_LIMIT: "1000"
      THROTTLE_MEDIUM_TTL: "60"
      THROTTLE_MEDIUM_LIMIT: "1000"
      THROTTLE_LONG_TTL: "3600"
      THROTTLE_LONG_LIMIT: "10000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/hello',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 3s
      timeout: 3s
      retries: 40

  nextjs:
    # NEXT_PUBLIC_* vars are inlined at build time by packages/frontend/dockerfile
    # (NEXT_PUBLIC_API_URL=http://localhost/api, NEXT_PUBLIC_MOCK unset -> false),
    # so nothing needs to be set here at runtime for the client bundle.
    build: ./packages/frontend/
    container_name: nextjs-e2e
    networks:
      - app-network
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-e2e
    networks:
      - app-network
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - nextjs
      - backend

volumes:
  agroscope_e2e_postgres:

networks:
  app-network:
    driver: bridge
