services:
  # IA (FastAPI). Comentado porque precisa dos modelos em packages/IA/models
  # (fora do Git) e a imagem tem ~3 GB. Para subir: crie packages/IA/.env a
  # partir do .env.example e descomente. O backend não precisa esperar a IA:
  # ele lê as culturas (GET /cultures) quando ela termina de carregar os modelos.
  # ia:
  #   build:
  #     context: ./packages/IA
  #     dockerfile: dockerfile
  #   env_file: ./packages/IA/.env
  #   environment:
  #     - SERVER_PORT=5000
  #   networks:
  #     - app-network
  #   ports:
  #     - "5000:5000"

  backend:
    build: ./packages/backend
    ports:
      - "3001:3001"
    networks:
      - app-network
    volumes:
      - ./packages/backend:/app
      - ./packages/backend/uploads:/app/uploads
    environment:
      - FLASK_API_URL=http://ia:5000
      - NODE_ENV=production
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost,http://nginx
    # depends_on:
    #   - db

  # db:
  #   image: postgres:15-alpine
  #   networks:
  #     - app-network
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: postgres
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   command: ["postgres"]

  nextjs:
    build: ./packages/frontend/
    container_name: nextjs
    networks:
      - app-network
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NEXT_PUBLIC_API_URL_PROD=http://nginx/api
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    networks:
      - app-network
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - nextjs
      - backend

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
